# config/default_game_template.yaml
game_name: "{game_name}"

detection:
  # 检测区域（待配置）
  killfeed_roi: [0.0, 0.0, 1.0, 1.0]
  
  # OCR文字识别配置
  ocr:
    enabled: true
    keywords: []  # 待配置，如 ["击杀", "KILL"]
    similarity_threshold: 0.8
    required: false
  
  # 模板匹配配置
  templates: {}  # 待配置
  template_dir: "models/templates/{game_name}"
  
  # 颜色检测配置
  colors: {}  # 待配置
  
  # 检测规则 (OR-of-AND 逻辑)
  # 规则之间为 OR（满足任一规则即判定为击杀）
  # 规则内条件为 AND（所有条件都需满足）
  # 留空则使用传统加权计算方式
  rules: []
  # 示例：
  # rules:
  #   - name: "color_and_yolo"
  #     enabled: true
  #     require: ["color", "yolo"]
  #   - name: "ocr_only"
  #     enabled: true
  #     require: ["ocr"]
  
  # 信号权重（仅在 rules 为空时生效）
  weights:
    ocr: 0.4
    template: 0.3
    color: 0.2
    yolo: 0.1
  
  # 预筛选
  prefilter:
    enabled: true
    color_threshold: 0.01
  
  # 多线程配置（加速精确检测）
  use_threading: true  # 是否启用多线程
  max_workers: 4  # 线程池大小，建议设置为 CPU 核心数
  
  # 置信度阈值（仅在 rules 为空时生效）
  confidence_threshold: 0.5

highlights:
  pre_kill_time: 5.0
  post_kill_time: 2.0
