# FPS Video Snap Default Configuration

# Global processing settings
global:
  output_dir: "output"
  temp_dir: "temp"
  history_dir: "history"
  device: "cuda" # cpu or cuda
  debug: false
  log_level: "INFO"
  # History management
  keep_history_days: 30
  max_history_files: 100

# Video processing settings
video:
  ffmpeg_path: "ffmpeg"
  hwaccel: "cuda"
  encoder: "h264_nvenc"
  bitrate: "20M"
  fps: 60
  
# AI Detection settings
detection:
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.5
  batch_size: 16
  # Time window for kill detection (seconds)
  time_window: 2.0
  # Default ROI (Region of Interest) for UI elements [x, y, w, h] as percentages (0.0 - 1.0)
  ui_roi: [0.0, 0.0, 1.0, 1.0]
  # Optional directory containing template images for UI element detection (e.g., killfeed icons)
  template_dir: ""

  # OCR Detection settings
  ocr:
    enabled: false
    keywords: ["击杀", "KILL"]
    similarity_threshold: 0.8
    lang: "ch" # 'ch' for Chinese, 'en' for English
    use_gpu: true

  # Template matching settings
  templates:
    skull_icon:
      path: "skull.png"
      threshold: 0.7
    kill_icon:
      path: "kill.png"
      threshold: 0.7

  # Multi-signal weights
  weights:
    ocr: 0.4
    template: 0.3
    color: 0.2
    yolo: 0.1

  # Fast pre-filtering settings
  prefilter:
    color_threshold: 0.01 # Percentage of pixels matching color to trigger deep detection

# Highilght generation settings
highlights:
  pre_kill_time: 3.0 # Seconds before kill
  post_kill_time: 1.0 # Seconds after kill
  multikill_threshold: 10.0 # Max seconds between kills in a sequence
  transition_type: "random" # "fade", "wipeleft", "wiperight", "slideup", "slidedown", "circlecrop", "random", or "none"
  transition_duration: 0.5 # Seconds
  music_enabled: true
  music_path: "assets/music/default_hype.mp3"
  game_volume: 0.5
  music_volume: 0.5
