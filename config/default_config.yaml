# FPS Video Snap Default Configuration
config_version: 1

# Global processing settings
global:
  output_dir: "output"
  temp_dir: "temp"
  history_dir: "history"
  device: "cuda" # cpu or cuda
  debug: false
  log_level: "INFO"
  # History management
  keep_history_days: 30
  max_history_files: 100

# Video processing settings
video:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  hwaccel: "cuda"
  encoder: "h264_nvenc"
  bitrate: "25M"
  fps: 60
  # Clip cutting behavior
  clip_cut:
    # If true, try fast "-c copy" cutting when highlights.transition_type is "none".
    # Note: many games/recorders produce open-GOP streams; stream copy clips may show
    # corruption at the start in VLC even if other players look fine.
    use_stream_copy: false
    # Align clip start time to the nearest previous keyframe to avoid decoder artifacts
    # (e.g., VLC showing corruption in the first ~seconds).
    # Note: This may shift the clip slightly earlier (typically within one GOP).
    align_to_keyframes: true
    # How far back to scan for a keyframe near the requested start time.
    keyframe_scan_window_s: 15.0
  join_fix:
    # Normalize join inputs to a safe intermediate format before concat/xfade.
    pre_normalize_clips: true
    # Keep intermediate joined artifacts for debugging startup corruption issues.
    keep_intermediates: false
    safe_preset: "medium"
    safe_crf: 18
    safe_audio_rate: 48000
    safe_channel_layout: "stereo"
    # Maximum inputs per xfade command. Large 4K chains can exhaust FFmpeg filter memory.
    # Set to 0 to disable segmented xfade joining.
    xfade_segment_size: 4
  # Frame extraction mode:
  # - bulk: single ffmpeg run with fps+showinfo mapping (fast, mapped timestamps)
  # - precise: per-frame ffmpeg -ss extraction (slow, deterministic)
  frame_extraction_mode: "bulk"

# AI Detection settings
ai:
  batch_size: 16
  # Keep normal runs offline. Set true only during initial setup if you want
  # Ultralytics to download a missing model automatically.
  allow_model_download: false

detection:
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.5
  chunk_size: 256
  # Time window for kill detection (seconds)
  time_window: 2.0
  # Default ROI (Region of Interest) for UI elements [x, y, w, h] as percentages (0.0 - 1.0)
  ui_roi: [0.0, 0.0, 1.0, 1.0]
  # Optional directory containing template images for UI element detection (e.g., killfeed icons)
  template_dir: ""

  # OCR Detection settings
  ocr:
    enabled: false
    keywords: ["击杀", "KILL"]
    similarity_threshold: 0.8
    lang: "ch" # 'ch' for Chinese, 'en' for English
    use_gpu: true

  # Template matching settings
  templates:
    skull_icon:
      path: "skull.png"
      threshold: 0.7
    kill_icon:
      path: "kill.png"
      threshold: 0.7

  # Multi-signal weights
  weights:
    ocr: 0.4
    template: 0.3
    color: 0.2
    yolo: 0.1

  # Fast pre-filtering settings
  prefilter:
    color_threshold: 0.01 # Percentage of pixels matching color to trigger deep detection

# Highlight generation settings
highlights:
  pre_kill_time: 3.0 # Seconds before kill
  post_kill_time: 1.0 # Seconds after kill
  multikill_threshold: 10.0 # Max seconds between kills in a sequence
  transition_type: "random" # "fade", "wipeleft", "wiperight", "slideup", "slidedown", "circlecrop", "random", or "none"
  transition_duration: 0.5 # Seconds
  music_enabled: true
  music_path: "assets/music/default_hype.mp3"
  game_volume: 0.5
  music_volume: 0.5
