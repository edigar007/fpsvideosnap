<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Video Snap - 剪辑控制台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="cyber-header">
            <div class="logo-area">
                <span class="icon">🎮</span>
                <h1>FPS Video Snap <span class="badge">PRO</span></h1>
            </div>
            <div class="status-indicator" id="globalStatus">
                <span class="status-dot"></span>
                <span class="status-text">系统就绪</span>
            </div>
        </header>

        <!-- Main Grid -->
        <main class="control-grid">
            <!-- Left Column: Controls -->
            <section class="panel control-panel">
                <div class="panel-header">
                    <h2>配置与源文件</h2>
                </div>
                
                <div class="panel-body">
                    <!-- Game Selection -->
                    <div class="form-group">
                        <label for="gameSelect">目标游戏</label>
                        <div class="select-wrapper">
                            <select id="gameSelect">
                                <option value="" disabled selected>加载中...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Directory Scan -->
                    <div class="form-group">
                        <label for="dirInput">视频目录</label>
                        <div class="input-group">
                            <input type="text" id="dirInput" placeholder="例如: D:\Videos\Battlefield 2042" value="D:\videos">
                            <button id="scanBtn" class="btn btn-secondary">
                                <span class="icon">🔍</span> 扫描
                            </button>
                        </div>
                    </div>

                    <!-- Video List -->
                    <div class="video-list-section">
                        <div class="list-header">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="selectAll">
                                <span class="checkmark"></span>
                                全选
                            </label>
                            <span class="counter" id="fileCount">0 个文件</span>
                        </div>
                        <div class="video-list-container" id="videoList">
                            <div class="empty-state">
                                <span>请扫描目录以查找视频文件</span>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="action-bar">
                        <div class="selection-info">
                            已选: <strong id="selectedCount" class="highlight-text">0</strong>
                        </div>
                        <button id="startBtn" class="btn btn-primary" disabled>
                            ▶️ 开始剪辑
                        </button>
                    </div>
                </div>
            </section>

            <!-- Right Column: Progress & Errors -->
            <section class="panel progress-panel">
                <div class="panel-header">
                    <h2>📊 处理进度</h2>
                </div>
                
                <!-- Progress Display -->
                <div class="progress-content" id="progressContent">
                    <!-- Current Video Info -->
                    <div class="current-video-info" id="currentVideoInfo">
                        <div class="video-label">等待开始...</div>
                    </div>
                    
                    <!-- Stage List -->
                    <div class="stage-list" id="stageList">
                        <div class="stage-item" data-stage="metadata">
                            <span class="stage-icon">⬜</span>
                            <span class="stage-name">视频元数据</span>
                        </div>
                        <div class="stage-item" data-stage="frames">
                            <span class="stage-icon">⬜</span>
                            <span class="stage-name">帧提取</span>
                        </div>
                        <div class="stage-item" data-stage="detection">
                            <span class="stage-icon">⬜</span>
                            <span class="stage-name">击杀检测</span>
                            <div class="stage-progress-bar">
                                <div class="stage-progress-fill" id="detectionProgressFill"></div>
                            </div>
                            <span class="stage-detail" id="detectionDetail"></span>
                        </div>
                        <div class="stage-item" data-stage="clips">
                            <span class="stage-icon">⬜</span>
                            <span class="stage-name">片段提取</span>
                        </div>
                        <div class="stage-item" data-stage="join">
                            <span class="stage-icon">⬜</span>
                            <span class="stage-name">视频拼接</span>
                        </div>
                        <div class="stage-item" data-stage="audio">
                            <span class="stage-icon">⬜</span>
                            <span class="stage-name">音频混合</span>
                        </div>
                    </div>
                    
                    <!-- Stats -->
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-value" id="killCount">0</span>
                            <span class="stat-label">检测到的击杀</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="clipCount">0</span>
                            <span class="stat-label">提取的片段</span>
                        </div>
                    </div>
                </div>
                
                <!-- Error Log (collapsed by default, shows only errors) -->
                <div class="error-section">
                    <div class="error-header" id="errorHeader">
                        <span>⚠️ 错误日志</span>
                        <span class="error-count" id="errorCount">0</span>
                    </div>
                    <div class="error-log" id="errorLog">
                        <!-- Errors will appear here -->
                    </div>
                </div>

                <div class="status-footer">
                    <div class="progress-info">
                        <span id="taskStatusText">状态: 空闲</span>
                    </div>
                    <button id="cancelBtn" class="btn btn-danger hidden">
                        🛑 取消任务
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
